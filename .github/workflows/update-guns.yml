name: Update gun build codes

on:
  schedule:
    # Mondays 06:07 Beijing time (UTC+8)
    - cron: "7 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_guns.py
      - name: Commit guns.json
        run: |
          git add guns.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update gun build codes $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase
          git push
