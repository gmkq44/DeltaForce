name: Update daily passwords

on:
  schedule:
    # 00:05, 00:35, 06:05, 12:05 Beijing time (UTC+8)
    - cron: "5 16 * * *"
    - cron: "35 16 * * *"
    - cron: "5 22 * * *"
    - cron: "5 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-passwords
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_passwords.py
      - name: Commit data.json
        run: |
          git add data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily passwords $(TZ=Asia/Shanghai date +%F)"
          git push
